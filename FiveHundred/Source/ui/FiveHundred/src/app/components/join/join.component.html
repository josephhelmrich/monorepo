
<div class="container pt-3">
  <div class="row">
    <div class="col justify-content-center">
      <h3>SELECT USER TO JOIN THE GAME</h3>
    </div>
  </div>
  <div class="row" *ngFor="let u of appState?.userList">
    <div class="col">
      <button type="button" class="btn btn-secondary full-width mb-3" (click)="joinGame_Click(u)">{{u.name}}</button>

    </div>
  </div>
</div>
