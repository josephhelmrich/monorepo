<div class="container-fluid pt-0">
  <div class="row">
    <div class="col-12">
      <app-create *ngIf="this.appState?.view == 'Create'"></app-create>
      <app-join *ngIf="this.appState?.view == 'Join'"></app-join>
      <app-event *ngIf="this.appState?.view === 'Game'"></app-event>
      <app-score-table *ngIf="this.appState?.view == 'Score'"></app-score-table>
      <app-chad-list *ngIf="this.appState?.view == 'Chads'"></app-chad-list>
      <app-statistic *ngIf="this.appState?.view == 'Statistics'"></app-statistic>
    </div>
  </div>
</div>
