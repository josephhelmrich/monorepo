<mat-dialog-content>
  <div class="container">
    <div class="row">
      <div class="col">
        <mat-icon aria-hidden="false" aria-label="icon" style="color: red;">error</mat-icon>
      </div>
      <div class="col">
        <button type="button" class="btn-close float-end" aria-label="Close" mat-dialog-close></button>
      </div>
    </div>
  </div>
  <div class="row pt-3">
    <div class="col">
      <span class="alert-text"><strong>{{userMessage}}</strong></span>
    </div>
  </div>
</mat-dialog-content>
