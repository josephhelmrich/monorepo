<mat-dialog-content>
  <div class="container">
    <div class="row">
      <div class="col pb-3">
        <button type="button" class="btn-close float-end" aria-label="Close" mat-dialog-close></button>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <button type="button" autofocus mat-dialog-close="RANDOM" class="btn btn-primary full-width mb-3">PICK RANDOM TEAMS</button>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <button *ngIf="this.event.currentGame"  mat-dialog-close="REMATCH" type="button" class="btn btn-SECONDARY full-width mb-3">REMATCH</button>
      </div>
    </div>
  </div>
</mat-dialog-content>
