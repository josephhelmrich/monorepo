<form class="form">
  <div class="container pt-3">
    <div class="row">
      <div class="col justify-content-center">
        <p>Enter Your Name and the name of 3 other players below</p>
      </div>
    </div>
    <div class="row align-items-start">
      <div class="col">
        <mat-form-field class="full-width" appearance="fill">
          <mat-label>ENTER YOUR NAME</mat-label>
          <input matInput type="text" placeholder="REQUIRED" [formControl]="nameFormControl" (change)="validate()" >
          <mat-error *ngIf="nameFormControl.hasError('required')">
            NAME IS <strong>REQUIRED</strong>
          </mat-error>
        </mat-form-field>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <mat-form-field class="full-width" appearance="fill">
          <mat-label>OTHER PLAYERS</mat-label>
          <textarea matInput rows="3" placeholder="REQUIRED" [formControl]="othersFormControl" (change)="validate()" (keydown)="validate()"></textarea>
          <mat-error *ngIf="othersFormControl.hasError('required')">
            3 OTHER PLAYERS ARE <strong>REQUIRED</strong>
          </mat-error>
        </mat-form-field>
      </div>
    </div>
    <div class="example-button-row">
      <div class="col">
        <button type="button" [disabled]="invalid" class="btn btn-primary" (click)="createGame_Click()">CREATE GAME</button>
      </div>
    </div>
    <div class="row mt-3" *ngIf="recentEvents.length > 0">
      <div class="col"><h2>Recent Games</h2></div>
    </div>
    <div *ngFor="let r of recentEvents">
      <div class="row">
        <div class="col">
          {{r.updated|date: 'short'}} - {{r.players}} - <a [href]="getJoinLink(r)">Join</a>
        </div>
      </div>
    </div>
  </div>
</form>
